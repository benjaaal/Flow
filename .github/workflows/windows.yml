name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile verified Windows package
        shell: powershell
        env:
          MACFLOW_REPOSITORY: ${{ github.repository }}
        run: ./build.ps1 -OutputDirectory ./artifacts -UpdateFeedUrl ('https://github.com/'+$env:MACFLOW_REPOSITORY+'/releases/latest/download/MacFlow-update.json')
      - name: Run isolated regression and interface checks
        shell: powershell
        run: |
          foreach($check in @(@('--self-test','core','self-tests.txt'),@('--modern-smoke','modern','checks.txt'),@('--renewal-27-test','renewal','checks.txt'),@('--curtain-27-test','curtain','checks.txt'))){
            $out=Join-Path $PWD ('artifacts/verification/'+$check[1])
            $app=Start-Process -FilePath './artifacts/portable/MacFlow.exe' -ArgumentList @($check[0],('"'+$out+'"')) -PassThru -WindowStyle Hidden
            if(!$app.WaitForExit(180000)){Stop-Process -Id $app.Id;throw ('Timeout: '+$check[0])}
            if($app.ExitCode -ne 0){Get-Content (Join-Path $out $check[2]);throw ('Validation failed: '+$check[0])}
          }
          Copy-Item 'docs/RELEASE-27.2.2.md' 'artifacts/RELEASE-NOTES.md'
      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacFlow-Windows-x64
          path: artifacts/
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch))
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacFlow-Windows-x64
          path: artifacts
      - name: Publish verified version and installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $package=Get-Content -Raw -LiteralPath artifacts/MacFlow-update.json | ConvertFrom-Json
          $tag='v'+$package.Version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'El tag no coincide con la versión compilada.' }
          $installer=Join-Path 'artifacts' $package.Installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $package.Sha256) { throw 'El SHA256 del instalador no coincide.' }
          $oldPreference=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          gh release view $tag --repo $env:GH_REPO --json tagName 2>$null
          $exists=$LASTEXITCODE -eq 0
          $ErrorActionPreference=$oldPreference
          if ($exists) { Write-Output 'Esta versión ya está publicada; no se reemplazará.'; exit 0 }
          gh release create $tag $installer ($installer+'.config') 'artifacts/MacFlow-update.json' --repo $env:GH_REPO --target $env:GITHUB_SHA --notes-file artifacts/RELEASE-NOTES.md --title ('MacFlow '+$package.Version)
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la versión.' }
